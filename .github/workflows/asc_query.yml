name: ASC Query
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: pyjwt 直查
        env:
          ASC_KEY_ID: ${{ secrets.ASC2_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC2_ISSUER }}
          ASC_API_KEY_P8: ${{ secrets.ASC2_P8 }}
        run: |
          pip install --quiet pyjwt cryptography
          echo "$ASC_API_KEY_P8" | base64 --decode > "$HOME/asc.pem"
          python3 - <<'PY'
          import os, json, time, jwt, urllib.request
          key = open(os.path.expanduser("~/asc.pem")).read()
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now-30, "exp": now+1100, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256",
                           headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def asc(path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com"+path,
                                           headers={"Authorization": "Bearer "+tok})
              try:
                  with urllib.request.urlopen(req) as r: return r.status, r.read().decode()
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:400]
          c, b = asc("/v1/apps?limit=50")
          if c != 200: print("APPS-HTTP", c, b); raise SystemExit(1)
          for a in json.loads(b)["data"]:
              at = a["attributes"]
              print("APP|", at.get("bundleId"), "|", at.get("name"), "|", a["id"])
              if "medseek" not in (at.get("bundleId") or ""): continue
              aid = a["id"]
              c, b = asc(f"/v1/apps/{aid}/betaGroups?limit=20")
              print("GROUPS|", b[:3200])
              c, b = asc("/v1/betaTesters?filter[email]=yangru158158@gmail.com&limit=5")
              print("GMAIL|", b[:1200])
              c, b = asc(f"/v1/builds?filter[app]={aid}&limit=2&sort=-version")
              for bd in json.loads(b).get("data", []):
                  cc, bb = asc(f"/v1/builds/{bd['id']}/buildBetaDetail")
                  try: attr = json.loads(bb)["data"]["attributes"]
                  except Exception: attr = bb[:200]
                  print("BUILD|", bd["attributes"].get("version"), "|", json.dumps(attr, ensure_ascii=False))
          PY
