name: MediaSeek
options:
  bundleIdPrefix: com.medseek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 0.1.6
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    # 2.0(2026-11-24):图像模型只剩 so400m,Base 停用并从在线数据源删除——
    # 新装流程与模型包结构不兼容 1.0,主版本号升 2。构建号(CURRENT_PROJECT_VERSION)
    # 由 release.yml 用 github.run_number 覆盖,继续递增不重置
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  MediaSeek:
    type: application
    platform: iOS
    sources:
      - path: MediaSeek
        excludes:
          - "Resources/Models"
      - path: MediaSeek/Resources/Models
        type: folder
        optional: true
    dependencies:
      - package: SwiftTransformers
        products: [Transformers]
      - package: ZIPFoundation
    settings:
      base:
        DEVELOPMENT_TEAM: QBU3P5SMNS
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: MediaSeek AppStore
        PRODUCT_BUNDLE_IDENTIFIER: com.medseek.MediaSeek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MediaSeek/Info.plist
      properties:
        CFBundleDisplayName: 智搜
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: 「智搜」需要读取你的照片与视频,在本机建立索引以支持语义搜索。所有处理均在设备本地完成,数据不会上传。
        NSSpeechRecognitionUsageDescription: 「智搜」在开启「视频语音转文字」后,用本机语音识别把视频里的话转成文字以支持搜索。音频不会上传,识别全部在本机完成。

schemes:
  MediaSeek:
    build:
      targets:
        MediaSeek: all
    run:
      config: Debug
    archive:
      config: Release
