name: Release to TestFlight
# 手动签名版:用预创建的 Apple Distribution 证书 + App Store 描述文件
# Secrets:
#   DISTRIBUTION_P12        distribution.p12 的 base64
#   P12_PASSWORD            p12 密码
#   PROFILE_MOBILEPROVISION 描述文件 .mobileprovision 的 base64
#   ASC_KEY_ID / ASC_API_KEY_P8  上传用 API 密钥(个人密钥)
#   DEVELOPMENT_TEAM_ID     QBU3P5SMNS
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 写入上传用 API 密钥
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p $HOME/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 导入分发证书到临时钥匙串
        env:
          DISTRIBUTION_P12: ${{ secrets.DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          echo "$DISTRIBUTION_P12" | base64 --decode > "$CERT_PATH"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p medseek-kc "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p medseek-kc "$KC"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k medseek-kc "$KC"
          security list-keychain -d user -s "$KC" login.keychain-db

      - name: 安装描述文件
        env:
          PROFILE: ${{ secrets.PROFILE_MOBILEPROVISION }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          CP="$HOME/Library/MobileDevice/Provisioning Profiles/MediaSeek_AppStore.mobileprovision"
          echo "$PROFILE" | base64 --decode > "$CP"

      - name: 归档(手动签名)
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project MediaSeek.xcodeproj \
            -scheme MediaSeek \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MediaSeek.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="MediaSeek AppStore"

      - name: 导出 IPA(手动签名)
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.medseek.MediaSeek</key>
              <string>MediaSeek AppStore</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/MediaSeek.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa

      - name: 上传 TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f build/ipa/*.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: 完成
        run: |
          echo "🎉 已上传 TestFlight!等待 5-15 分钟处理后:"
          echo "   ASC → TestFlight → 内部测试 → 添加测试员"
          echo "   iPhone 的 TestFlight App 中安装"
