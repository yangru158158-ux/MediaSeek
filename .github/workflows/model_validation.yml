name: Model Validation
# SigLIP2 产线管道体检(transformers 5 单环境):
# ①官方 processor+pipeline 对拍(模型健康度) ②真值匹配对/交叉对尺度 ③产线导出链
#   (文本塔定长64双输入+手工4D掩码直通 encoder)CoreML 一致性与端到端区分度
# ④掩码语义阻断回归(第四十九批:SigLIP2 训练不掩码 pad,全1掩码=训练语义,
#   真实掩码=内容失明事故形态,不一致即退出非零)
# ⑤性别对比边距阻断回归(第五十批:性别词对比过滤的依据,女照边距≥+0.012/
#   男照≤0,边距复崩即退出非零)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/validate_siglip_coreml.py"
      - "scripts/export_models.py"
      - "scripts/patch_transformers_for_coreml.py"
      - ".github/workflows/model_validation.yml"

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖(与产线同版本)
        run: |
          pip install --upgrade pip
          pip install torch==2.7.0 "transformers>=5.0" "coremltools==9.0" sentencepiece pillow

      - name: 打 coremltools 兼容补丁
        run: python scripts/patch_transformers_for_coreml.py

      - name: 运行体检
        run: python scripts/validate_siglip_coreml.py extract v5.npz

      - name: 上传 npz(留档)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-npz
          path: "*.npz"
          retention-days: 90
          if-no-files-found: ignore
