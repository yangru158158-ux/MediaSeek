name: ASC Query
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: macOS-latest
    steps:
      - name: Spaceship 查询
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          echo "$ASC_API_KEY_P8" | base64 --decode > "$HOME/asc.pem"
          echo "SIZE: $(wc -c < "$HOME/asc.pem")"
          echo "MD5: $(md5 -q "$HOME/asc.pem")"
          echo "EC-CHECK: $(openssl ec -in "$HOME/asc.pem" -noout 2>&1 | head -1)"
          openssl asn1parse -in "$HOME/asc.pem" -i 2>&1 | head -6
          ruby -e '
            require "spaceship"
            tok = Spaceship::ConnectAPI::Token.create(
              key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"],
              key: File.expand_path("~/asc.pem"))
            Spaceship::ConnectAPI.token = tok
            apps = Spaceship::ConnectAPI::App.all
            apps.each { |a| puts "APP|#{a.bundle_id}|#{a.name}|#{a.id}" }
            app = apps.find { |a| a.bundle_id.to_s.include?("medseek") }
            abort "no medseek app" unless app
            puts "==APP #{app.id}"
            g = Spaceship::ConnectAPI.get("betaGroups?filter[app]=#{app.id}&limit=20")
            puts "GROUPS|#{g.body}"
            t = Spaceship::ConnectAPI.get("betaTesters?filter[email]=yangru158158@gmail.com&limit=5")
            puts "GMAIL|#{t.body}"
            b = Spaceship::ConnectAPI.get("builds?filter[app]=#{app.id}&limit=2&sort=-version")
            b.body["data"].each do |bd|
              bid = bd["id"]; ver = bd.dig("attributes","version")
              d = Spaceship::ConnectAPI.get("builds/#{bid}/buildBetaDetail")
              puts "BUILD|#{ver}|#{d.body.dig("data","attributes").to_json}"
            end
          '
