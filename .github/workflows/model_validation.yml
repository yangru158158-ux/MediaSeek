name: Model Validation
# SigLIP2 产线管道体检:transformers 4(投影空间) vs 5(pooler 空间) 同检查点对质
# 判定设备上 models.zip(v5 导出)装的是不是检查点训练时的真实联合嵌入空间
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 v5 依赖(与产线同版本)
        run: |
          pip install --upgrade pip
          pip install torch==2.7.0 "transformers>=5.0" "coremltools==9.0" sentencepiece pillow

      - name: v5 环境打 coremltools 补丁
        run: python scripts/patch_transformers_for_coreml.py

      - name: v5 侧提取特征
        run: python scripts/validate_siglip_coreml.py extract v5.npz

      - name: 建 v4 对照环境
        run: |
          python -m venv /tmp/v4env
          /tmp/v4env/bin/pip install --upgrade pip
          /tmp/v4env/bin/pip install torch==2.7.0 "transformers==4.55.0" "coremltools==9.0" sentencepiece pillow

      - name: v4 环境打 coremltools 补丁
        run: /tmp/v4env/bin/python scripts/patch_transformers_for_coreml.py

      - name: v4 侧提取特征+产线导出链验证
        run: /tmp/v4env/bin/python scripts/validate_siglip_coreml.py extract v4.npz

      - name: 对质
        run: python scripts/validate_siglip_coreml.py compare v4.npz v5.npz

      - name: 上传 npz(留档)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-npz
          path: "*.npz"
          retention-days: 90
          if-no-files-found: ignore
