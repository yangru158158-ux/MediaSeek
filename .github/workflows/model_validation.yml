name: Model Validation
# SigLIP2 产线管道体检:PyTorch 官方参考 vs 产线 trace+coremltools 转换
# 回答三件事:①转换一致性 ②匹配对真实尺度 ③App 式拉伸预处理的罚分
# 依赖与 export_models.yml 完全一致(同版本,结论才对产线有效)
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖(与产线同版本)
        run: |
          pip install --upgrade pip
          pip install torch==2.7.0 "transformers>=5.0" "coremltools==9.0" sentencepiece pillow

      - name: 打 coremltools 兼容补丁
        run: python scripts/patch_transformers_for_coreml.py

      - name: 运行体检
        run: |
          python scripts/validate_siglip_coreml.py 2>&1 | tee validation_report.txt

      - name: 上传体检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_report.txt
          retention-days: 90
