name: Face E2E
# 真实照片端到端:下载真人照片 → Vision 检测 → FaceKit 对齐(App 同源码)
# → r50 onnxruntime 打分,断言同人分高/跨人分低。合成图几何测试
# (face_test.yml)只验证眼位落位,真实照片上的质量由本工作流把关;
# 对齐图上传工件供人工目检。触发:FaceKit/工具/工作流变更。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "MediaSeek/Core/FaceKit.swift"
      - "scripts/face_e2e_align.swift"
      - "scripts/face_e2e_score.py"
      - ".github/workflows/face_e2e.yml"

jobs:
  e2e:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打分依赖
        run: pip install onnxruntime numpy pillow

      - name: 下载测试照片(维基共享资源,3 人×多张不同角度/年代)
        # 命名 <人物>_<序号>:打分脚本按人物名做真值标签,验证「同人合成一组、
        # 不同人不混组」——140 用户实测「同一人分了好几组」的回归闸门
        run: |
          cd "$RUNNER_TEMP"
          dl() { curl -fL --retry 3 --retry-delay 5 -A "Mozilla/5.0 (MediaSeek-CI)" -o "$1" "$2"; sleep 2; }
          dl obama_1.jpg "https://upload.wikimedia.org/wikipedia/commons/8/8d/President_Barack_Obama.jpg"
          dl obama_2.jpg "https://upload.wikimedia.org/wikipedia/commons/e/e9/Official_portrait_of_Barack_Obama.jpg"
          dl obama_3.png "https://upload.wikimedia.org/wikipedia/commons/e/ec/Barack_H._Obama_%284x5%29.png"
          dl trump_1.jpg "https://upload.wikimedia.org/wikipedia/commons/5/56/Donald_Trump_official_portrait.jpg"
          dl trump_2.jpg "https://upload.wikimedia.org/wikipedia/commons/5/53/Donald_Trump_official_portrait_%28cropped%29.jpg"
          dl trump_3.jpg "https://upload.wikimedia.org/wikipedia/commons/e/e7/National_Portrait_Gallery_Portrait_of_President_Donald_J_Trump_2026_%28HR%29.jpg"
          dl clinton_1.jpg "https://upload.wikimedia.org/wikipedia/commons/2/27/Hillary_Clinton_official_Secretary_of_State_portrait_crop.jpg"
          dl clinton_2.jpg "https://upload.wikimedia.org/wikipedia/commons/9/97/Hillary_Clinton_Portrait_%283x4_close_cropped%29.jpg"
          dl clinton_3.jpg "https://upload.wikimedia.org/wikipedia/commons/d/dd/Hillary_Rodham_Clinton.jpg"
          ls -la *.jpg *.png

      - name: 下载人脸模型(与在线更新源同源 r50)
        run: |
          curl -sL -o "$RUNNER_TEMP/buffalo_l.zip" \
            https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
          unzip -o -j "$RUNNER_TEMP/buffalo_l.zip" w600k_r50.onnx -d "$RUNNER_TEMP/face"

      - name: 编译并运行对齐(Vision + FaceKit,与 App 同源码)
        run: |
          swiftc -O MediaSeek/Core/FaceKit.swift scripts/face_e2e_align.swift -o /tmp/face_e2e_align
          /tmp/face_e2e_align "$RUNNER_TEMP/aligned" "$RUNNER_TEMP"/*_[0-9].jpg "$RUNNER_TEMP"/*_[0-9].png

      - name: r50 打分 + 聚类/合并断言
        # 阈值与 App 平衡模式一致(入组 0.58 / 连接 = 入组+0.06)
        run: |
          python scripts/face_e2e_score.py \
            --model "$RUNNER_TEMP/face/w600k_r50.onnx" \
            --dir "$RUNNER_TEMP/aligned" \
            --threshold 0.58 --link 0.64

      - name: 上传对齐图(人工目检用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aligned-faces
          path: ${{ runner.temp }}/aligned/
          retention-days: 30
