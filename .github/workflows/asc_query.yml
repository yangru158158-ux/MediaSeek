name: ASC Query
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: macOS-latest
    steps:
      - name: ruby-jwt 直查
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          echo "$ASC_API_KEY_P8" | base64 --decode > "$HOME/asc.pem"
          cat > /tmp/q.rb <<'RUBY'
          require "jwt"; require "net/http"; require "uri"; require "json"
          key = OpenSSL::PKey.read(File.expand_path("~/asc.pem"))
          payload = { iss: ENV["ASC_ISSUER_ID"], iat: Time.now.to_i - 30, exp: Time.now.to_i + 1100 }
          jwt = JWT.encode(payload, key, "ES256", { kid: ENV["ASC_KEY_ID"], typ: "JWT" })
          def asc(path, jwt)
            u = URI("https://api.appstoreconnect.apple.com" + path)
            r = Net::HTTP.start(u.host, 443, use_ssl: true) { |h| h.get(u.request_uri, {"Authorization" => "Bearer " + jwt}) }
            [r.code.to_i, r.body]
          end
          code, body = asc("/v1/apps?limit=50", jwt)
          abort "APPS-HTTP #{code}: #{body[0,300]}" if code != 200
          apps = JSON.parse(body)
          apps["data"].each do |a|
            puts "APP| #{a["attributes"]["bundleId"]} | #{a["attributes"]["name"]} | #{a["id"]}"
            next unless a["attributes"]["bundleId"].to_s.include?("medseek")
            aid = a["id"]
            c, b = asc("/v1/apps/#{aid}/betaGroups?limit=20", jwt)
            puts "GROUPS| #{b[0,3200]}"
            c, b = asc("/v1/betaTesters?filter[email]=yangru158158@gmail.com&limit=5", jwt)
            puts "GMAIL| #{b[0,1200]}"
            c, b = asc("/v1/builds?filter[app]=#{aid}&limit=2&sort=-version", jwt)
            JSON.parse(b)["data"].each do |bd|
              cc, bb = asc("/v1/builds/#{bd["id"]}/buildBetaDetail", jwt)
              attr = ((JSON.parse(bb)["data"] || {})["attributes"] || {}).to_json rescue bb[0,200]
              puts "BUILD| #{bd["attributes"]["version"]} | #{attr}"
            end
          end
          RUBY
          ruby /tmp/q.rb
