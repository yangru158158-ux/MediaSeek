name: Export Models
# 在 GitHub 免费提供的 macOS 机器上运行模型转换
# (coremltools 完整运行库仅 macOS 可用;Windows 上转换会缺库)
# 产出:models.zip(基础包)+ models-so400m.zip(图像模型),App 内
# 设置→模型在线更新 下载导入(App 的 IPA 本身不含任何模型)
#
# 单环境 transformers 5(2026-10-12 定案):
#   Gemma wrapper 自管掩码,不经 masking_utils;
#   SigLIP 文本塔在 export_models.py 内手工构建 4D 加性掩码直通 encoder,
#   绕开 v5 动态掩码闭包(coremltools 不可转)与 v4 的 argmax 池化错位(SigLIP2 池化锚点=末位)
#
# 2026-10-13 增加:so400m 增强图像模型包 + GitHub Release(models tag)托管,
# App 内 设置→模型在线更新 直接下载导入(manifest.json 描述各包版本/大小)
#
# 2026-11-24 2.0(用户拍板:Base 不再使用,数据源删掉以降低新用户下载量):
#   ① 完整包不再含 Base 图像模型(主导出加 --skip-siglip),只剩文本+人脸。
#      旧完整包 1,204,084,539 字节里 Base(ImageEmbedder)占 0.707GB/58.7%,
#      新用户合计下载 3.320GB → 2.613GB
#   ② so400m 成唯一图像模型、必装:导出失败不再 continue-on-error(缺它新装
#      用户装不了),失败即本次不发布任何包
#   ③ 发布不再 delete+create(批162 起改「临时名上传 → 核对 → 换名」,见发布步骤注释)
#   ④ 指纹:完整包去掉 I 段(2.0 客户端 ModelManager.installedFingerprint 同规)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/export_models.py"
      - "scripts/export_face.py"
      - "scripts/patch_transformers_for_coreml.py"
      - ".github/workflows/export_models.yml"

permissions:
  contents: write   # 发布 Release(在线更新源)需要

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖(官方测试组合)
        run: |
          pip install --upgrade pip
          pip install torch==2.7.0 "transformers>=5.0" "coremltools==9.0" sentencepiece onnx onnx2torch onnxruntime

      - name: 打 coremltools 兼容补丁
        run: python scripts/patch_transformers_for_coreml.py

      - name: 下载人脸模型(insightface buffalo_l 的 r50,非商用许可,仅内部测试用)
        # 2026-10-13 由 buffalo_s 的 MobileFaceNet 升级 r50:mbf 轻量模型区分度
        # 天花板低,60% 分档同时装着同人的难照片与跨人/截图,分组混人(r50 端侧
        # 推理仍为毫秒级;检测/对齐不变,仅换身份嵌入模型)
        run: |
          curl -sL -o "$RUNNER_TEMP/buffalo_l.zip" https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
          unzip -o -j "$RUNNER_TEMP/buffalo_l.zip" w600k_r50.onnx -d "$RUNNER_TEMP/face"

      - name: 导出文本模型(coremltools 9;2.0 起 Base 图像模型不再导出)
        # --skip-siglip:输出目录不留 ImageEmbedder/,下一步 export_face.py 全量
        # 打包时 models.zip 自然只剩 TextEmbedder + FaceEmbedder
        run: |
          python scripts/export_models.py \
            --outdir MediaSeek/Resources/Models \
            --skip-siglip

      - name: 导出人脸模型并打包(onnx2torch→trace→ct,同环境)
        run: |
          python scripts/export_face.py \
            --onnx "$RUNNER_TEMP/face/w600k_r50.onnx" \
            --outdir MediaSeek/Resources/Models

      - name: 导出图像模型(so400m,2.0 起唯一图像模型,必装)
        # 2.0 前是可选增强包,失败不阻塞主包发布(continue-on-error)。现在它是
        # 唯一的图像模型,缺包=新装用户装不了,所以失败即整个 job 失败、本次
        # 不发布(在线源保留上一次完整的一组)。877M 参数在 7GB 内存 runner 上
        # 偏紧,失败时重跑本 workflow 即可
        env:
          SIGLIP_MODEL: google/siglip2-so400m-patch14-384
        run: |
          python scripts/export_models.py \
            --outdir "$RUNNER_TEMP/so400m" \
            --skip-gemma \
            --zip models-so400m.zip

      - name: 上传模型包
        uses: actions/upload-artifact@v4
        with:
          name: models-zip
          path: models.zip
          retention-days: 90

      - name: 上传仅人脸增量包
        uses: actions/upload-artifact@v4
        with:
          name: face-only-zip
          path: face-only.zip
          retention-days: 90

      - name: 生成更新清单 manifest.json
        run: |
          python - <<'EOF'
          import json, os, datetime, zipfile
          files = []
          def add(key, name, path, note, fingerprint=""):
              if os.path.exists(path):
                  files.append({
                      "key": key, "name": name,
                      "url": "https://github.com/yangru158158-ux/MediaSeek/releases/download/models/" + path,
                      "size": os.path.getsize(path), "note": note,
                      "fingerprint": fingerprint})
          # 批89:内容指纹——读 zip 内各槽位 meta.json 的内容派生字段
          # (文本/图像=dim,人脸=dim+ONNX 字节数)。值随模型内容变、不随重发变:
          # CI 重发同一批模型(版本字符串必变)指纹不变,App 端比对后明示
          # 「与服务端一致,无需重装」,不再诱导用户重下未变化的 1.2GB/2.1GB。
          # 拼法与 ModelManager.installedFingerprint 同规,改一处须同步另一处
          # 2.0:完整包指纹去掉 I 段(包内已无 Base 图像模型);so400m 仍是 P:dim,
          # 客户端 2.0 改从唯一图像槽位 ImageEmbedder 取。已装 1.0 全套模型的设备
          # 升级后两段指纹预期逐段相等——两个包都显示「与服务端一致,无需重装」
          def slot_meta(zpath, dirname):
              try:
                  with zipfile.ZipFile(zpath) as z:
                      n = dirname + "/meta.json"
                      if n in z.namelist():
                          return json.loads(z.read(n))
              except Exception:
                  pass
              return {}
          def fp_full():
              t = slot_meta("models.zip", "TextEmbedder")
              f = slot_meta("models.zip", "FaceEmbedder")
              return "T:%d|F:%d:%d" % (
                  t.get("dim", 0), f.get("dim", 0), f.get("model_size", 0))
          def fp_pro():
              i = slot_meta("models-so400m.zip", "ImageEmbedder")
              return "P:%d" % i.get("dim", 0)
          add("full", "基础模型包(文本+人脸)", "models.zip",
              "文本+人脸;与图像模型包配套,首次安装两个都要装", fingerprint=fp_full())
          # 第八十四批:人脸增量包②下架——完整包①自 10-13 起已内置 r50 人脸,
          # ②只对更旧的①有用,新装走不到(客户端 ModelUpdateView 已同步过滤
          # key=face;face-only.zip 仍随 Release 上传,仅不再进 manifest)
          add("so400m", "图像模型(SigLIP2 so400m)", "models-so400m.zip",
              "唯一图像模型,必装;图像向量若需重建会自动开始(约1-2小时)", fingerprint=fp_pro())
          m = {
              "version": (os.environ.get("GITHUB_SHA", "")[:7] or "dev")
                         + "-" + datetime.datetime.utcnow().strftime("%Y%m%d%H%M"),
              "date": datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC"),
              "files": files,
          }
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(m, f, ensure_ascii=False, indent=1)
          print(json.dumps(m, ensure_ascii=False)[:600])
          EOF

      - name: 发布模型包到 GitHub Release(在线更新源)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in models.zip face-only.zip models-so400m.zip; do
            [ -f "$f" ] || { echo "::error::缺少 $f,本次不发布(在线源保持原样)"; exit 1; }
          done
          # 批162(2026-11-28):先传临时名,核对无误后再换名。此前是 gh release upload
          # --clobber 直接按正式名覆盖。gh 的 --clobber 是「先删同名旧资产、再上传」
          # (源码 pkg/cmd/release/shared/upload.go 的 uploadWithDelete):2.1GB 的 so400m
          # 传完之前线上没有它;传失败(重试 3 次仍败)时旧包已删、新包没上,线上一直
          # 缺包到下一次重发成功为止,期间重装 / 换机装不了模型。(原注释写的是「旧资产
          # 在被新文件替换前始终可下载」,与 gh 的实际行为相反,已更正。)
          # 现在:
          #   ① 线上有正式名缺失就停(上次换名中断;不自动处理,什么都不动)
          #   ② 清上次失败留下的 *.staging / *.previous
          #   ③ 四个文件全部按「正式名.staging」上传
          #   ④ 逐个核对线上资产的字节数与 sha256 和本地一致
          #   ⑤ 换名:三个包先换,清单最后换
          #   ⑥ 收尾断言:四个正式名都在,没有临时名残留
          # ③④ 任何失败都碰不到正式名资产。⑤ 每个文件:旧包改名 .previous → 临时包改成
          # 正式名 → 确认正式名已是新包 → 才删 .previous。旧字节在新包就位之后才删,
          # 正式名空缺只有一次接口调用的间隔。
          # ⑤ 中途失败(接口偶发失败)时线上会留 *.staging / *.previous,内容都是完整的,
          # 本步骤会打印线上现状:把缺的正式名用 .staging 包顶上(或把 .previous 包改
          # 回去),再重跑(直接重跑会被 ① 拦下,不会把事情弄得更糟):
          #   gh api -X PATCH -f name=<正式名> repos/<owner/repo>/releases/assets/<id>
          # 改这段先跑 scripts/sim_publish_models.py(本机用假的 gh 注入各种失败,核对不变量)
          TAG=models
          REPO="$GITHUB_REPOSITORY"
          API="repos/$REPO/releases/tags/$TAG"
          STAGE=".staging"
          OLD=".previous"
          FILES="models.zip face-only.zip models-so400m.zip manifest.json"
          PHASE=start
          gh --version

          # 线上资产表:每行「id 名字 字节数 sha256:…(接口没给则为空)」,按名字排序
          list_assets() {
            gh api "$API" | python -c 'import json, sys; [print("%d\t%s\t%d\t%s" % (a["id"], a["name"], a["size"], a.get("digest") or "")) for a in sorted(json.loads(sys.stdin.buffer.read().decode("utf-8"))["assets"], key=lambda a: a["name"])]'
          }
          col() { printf '%s\n' "$1" | awk -F'\t' -v c="$2" '{print $c}'; }
          # 取某个名字的资产行。读表失败就中止(此后的步骤都还没动正式名)
          row_of() {
            local r
            r="$(list_assets | awk -F'\t' -v n="$1" '$2 == n')" \
              || { echo "::error::读线上资产表失败($1)——中止"; exit 1; }
            printf '%s' "$r"
          }
          rename_asset() {  # $1=资产行  $2=它此刻的名字  $3=新名字
            [ "$(col "$1" 2)" = "$2" ] || { echo "::error::要改名的是 $2,线上却是 $(col "$1" 2)——中止"; exit 1; }
            gh api -X PATCH -f name="$3" "repos/$REPO/releases/assets/$(col "$1" 1)" >/dev/null \
              || { echo "::error::改名失败 $2 → $3"; exit 1; }
            echo "改名 $2 → $3"
          }
          delete_asset() {  # $1=资产行  $2=它此刻的名字(只允许临时名;正式名资产从不删,只改名)
            [ "$(col "$1" 2)" = "$2" ] || { echo "::error::要删的是 $2,线上却是 $(col "$1" 2)——中止"; exit 1; }
            case "$2" in
              *.staging|*.previous) ;;
              *) echo "::error::拒绝删除 $2(只删临时名资产)——中止"; exit 1 ;;
            esac
            gh api -X DELETE "repos/$REPO/releases/assets/$(col "$1" 1)" \
              || { echo "::error::删除失败 $2"; exit 1; }
            echo "删除 $2"
          }
          # 失败时打印线上现状;换名阶段失败时附恢复办法
          on_exit() {
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "本步骤失败(退出码 $code)。线上现状:"
              list_assets || true
              if [ "$PHASE" = swap ]; then
                echo "::error::换名阶段中断。*.staging / *.previous 的内容都是完整的:按上面的现状把缺的正式名改回去,再重跑"
                echo "恢复命令: gh api -X PATCH -f name=<正式名> repos/$REPO/releases/assets/<id>"
              fi
            fi
          }
          trap on_exit EXIT

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # 首次发布:线上还没有这个 Release,没有旧资产可保护
            gh release create "$TAG" --repo "$REPO" $FILES \
              --title "模型包(在线更新源)" \
              --notes "CI 自动发布;App 内 设置→模型在线更新 读取 manifest.json。仅限本人设备使用。"
            list_assets
            exit 0
          fi
          # ① 上次运行若在换名阶段中断,线上会有正式名缺失。缺的那个文件在 *.staging /
          #    *.previous 里内容是完整的,但该把哪一个改回正式名要看当时换到哪一步,
          #    所以不自动处理、什么都不动,手工改一条名字后再重跑
          for n in $FILES; do
            row="$(row_of "$n")"
            [ -n "$row" ] || {
              echo "::error::线上缺少正式名 $n(上次运行可能在换名阶段中断)。本次什么都不改。"
              echo "手工恢复: gh api -X PATCH -f name=$n repos/$REPO/releases/assets/<下表中 $n$STAGE 或 $n$OLD 的 id>"
              exit 1
            }
          done
          # ② 清上次失败留下的临时名资产(四个正式名都在;它们不被清单引用)
          for n in $FILES; do
            for s in "$n$STAGE" "$n$OLD"; do
              row="$(row_of "$s")"
              [ -z "$row" ] || delete_asset "$row" "$s"
            done
          done
          # ③ 全部按临时名上传(硬链接改名,不复制 2GB)。这一段任何失败都碰不到正式名资产
          STAGED=""
          for n in $FILES; do
            ln -f "$n" "$n$STAGE"
            STAGED="$STAGED $n$STAGE"
          done
          gh release upload "$TAG" --repo "$REPO" $STAGED
          # ④ 核对:线上每个临时资产的字节数、sha256 都要和本地一致。另查体量:新包不得
          #    小于线上同名包的一半——上面两条只保证「传上去的和本地一致」,防不了导出
          #    本身残缺或拿错文件;一半这条线很宽松,只拦量级错误
          for n in $FILES; do
            s="$n$STAGE"
            row="$(row_of "$s")"
            [ -n "$row" ] || { echo "::error::线上找不到 $s——中止,正式名资产没动"; exit 1; }
            local_size="$(wc -c < "$s" | tr -d '[:space:]')"
            local_sha="sha256:$(shasum -a 256 "$s" | awk '{print $1}')"
            if [ "$(col "$row" 3)" != "$local_size" ]; then
              echo "::error::$s 字节数不一致:线上 $(col "$row" 3),本地 $local_size——中止,正式名资产没动"; exit 1
            fi
            if [ -z "$(col "$row" 4)" ]; then
              echo "::warning::$s 接口没返回 sha256,只核对了字节数"
            elif [ "$(col "$row" 4)" != "$local_sha" ]; then
              echo "::error::$s sha256 不一致:线上 $(col "$row" 4),本地 $local_sha——中止,正式名资产没动"; exit 1
            fi
            case "$n" in
              *.zip)
                online_row="$(row_of "$n")"
                if [ -n "$online_row" ] && [ "$local_size" -lt "$(( $(col "$online_row" 3) / 2 ))" ]; then
                  echo "::error::$n 新包只有 $local_size 字节,不到线上同名包($(col "$online_row" 3) 字节)的一半——导出可能残缺或拿错了文件,中止,正式名资产没动"; exit 1
                fi ;;
            esac
            echo "核对通过 $s $local_size 字节 $local_sha"
          done
          # ⑤ 换名:三个包先换,清单最后换(清单指向的包都已就位)
          PHASE=swap
          for n in $FILES; do
            new_row="$(row_of "$n$STAGE")"
            [ -n "$new_row" ] || { echo "::error::换名前线上找不到 $n$STAGE"; exit 1; }
            old_row="$(row_of "$n")"
            if [ -n "$old_row" ]; then rename_asset "$old_row" "$n" "$n$OLD"; fi
            rename_asset "$new_row" "$n$STAGE" "$n"
            now_row="$(row_of "$n")"
            [ "$(col "$now_row" 1)" = "$(col "$new_row" 1)" ] \
              || { echo "::error::换名后正式名 $n 指向的不是刚核对过的资产——中止(旧包仍在 $n$OLD)"; exit 1; }
            if [ -n "$old_row" ]; then
              prev_row="$(row_of "$n$OLD")"
              if [ "$(col "$prev_row" 1)" = "$(col "$old_row" 1)" ]; then
                delete_asset "$prev_row" "$n$OLD"
              else
                echo "::warning::找不到刚改名的旧包 $n$OLD(id 应为 $(col "$old_row" 1)),留着不删"
              fi
            fi
          done
          # ⑥ 收尾断言:四个正式名都在,没有临时名残留
          PHASE=final
          if ! names="$(list_assets | awk -F'\t' '{print $2}')"; then
            echo "::error::四个文件已换名完成,但读线上资产表失败——请到 Release 页确认"; exit 1
          fi
          for n in $FILES; do
            printf '%s\n' "$names" | grep -qx "$n" || { echo "::error::发布后线上缺少 $n"; exit 1; }
          done
          if printf '%s\n' "$names" | grep -Eq -e "${STAGE}\$" -e "${OLD}\$"; then
            echo "::error::发布后线上还有临时名资产残留(四个正式名都在、可用;到 Release 页删掉残留即可)"; exit 1
          fi
          echo "发布完成,线上资产:"
          list_assets
