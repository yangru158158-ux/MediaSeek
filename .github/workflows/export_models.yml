name: Export Models
# 在 GitHub 免费提供的 macOS 机器上运行模型转换
# (coremltools 完整运行库仅 macOS 可用;Windows 上转换会缺库)
# 产出:models.zip 工件(含 TextEmbedder + ImageEmbedder),下载后导入 App 即可
#
# 单环境 transformers 5(2026-10-12 定案):
#   Gemma wrapper 自管掩码,不经 masking_utils;
#   SigLIP 文本塔在 export_models.py 内手工构建 4D 加性掩码直通 encoder,
#   绕开 v5 动态掩码闭包(coremltools 不可转)与 v4 的 argmax 池化错位(SigLIP2 池化锚点=末位)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/export_models.py"
      - "scripts/patch_transformers_for_coreml.py"
      - ".github/workflows/export_models.yml"

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖(官方测试组合)
        run: |
          pip install --upgrade pip
          pip install torch==2.7.0 "transformers>=5.0" "coremltools==9.0" sentencepiece onnx onnxruntime

      - name: 打 coremltools 兼容补丁
        run: python scripts/patch_transformers_for_coreml.py

      - name: 下载人脸模型(insightface MobileFaceNet,非商用许可,仅内部测试用)
        run: |
          curl -sL -o "$RUNNER_TEMP/buffalo_s.zip" https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_s.zip
          unzip -o -j "$RUNNER_TEMP/buffalo_s.zip" w600k_mbf.onnx -d "$RUNNER_TEMP/face"

      - name: 导出模型
        run: |
          python scripts/export_models.py \
            --outdir MediaSeek/Resources/Models \
            --face "$RUNNER_TEMP/face/w600k_mbf.onnx" \
            --zip models.zip

      - name: 上传模型包
        uses: actions/upload-artifact@v4
        with:
          name: models-zip
          path: models.zip
          retention-days: 90

      - name: 上传仅人脸增量包
        uses: actions/upload-artifact@v4
        with:
          name: face-only-zip
          path: face-only.zip
          retention-days: 90
