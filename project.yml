name: MediaSeek
options:
  bundleIdPrefix: com.medseek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 0.1.6
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    # 2.1(2026-11-25,批137~139):图像模型只剩 so400m,Base 停用并从在线数据源删除——
    # 新装流程与模型包结构不兼容 1.0,主版本号升 2。版本名几经变化:
    #   「2.0」:构建号直接用 github.run_number,一路累积到 298;
    #   「2」  :想让构建号从 1 重新开始。上传没被拒,但 App Store Connect 把它归进
    #           「版本 2.0」显示(与 298 并列),构建号 1 比已装的 298 小,手机
    #           TestFlight 上不出现(2026-11-25 装机实锤);
    #   「2.1」:数值大于 2.0,才真正自成一个新的版本。
    # 构建号只在同一版本名内要求递增(Apple TN2420:build numbers must be unique
    # within each release train),换版本名后可以从 1 起算;release.yml 里
    # 构建号 = 运行序号 - 偏移量。教训:想要一个全新的版本,版本名要在数值上
    # 比上一个大,「2」与「2.0」在苹果那边是同一个版本
    MARKETING_VERSION: "2.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  MediaSeek:
    type: application
    platform: iOS
    sources:
      - path: MediaSeek
        excludes:
          - "Resources/Models"
      - path: MediaSeek/Resources/Models
        type: folder
        optional: true
    dependencies:
      - package: SwiftTransformers
        products: [Transformers]
      - package: ZIPFoundation
    settings:
      base:
        DEVELOPMENT_TEAM: QBU3P5SMNS
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: MediaSeek AppStore
        PRODUCT_BUNDLE_IDENTIFIER: com.medseek.MediaSeek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MediaSeek/Info.plist
      properties:
        CFBundleDisplayName: 智搜
        CFBundleShortVersionString: "2.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: 「智搜」需要读取你的照片与视频,在本机建立索引以支持语义搜索。所有处理均在设备本地完成,数据不会上传。
        NSSpeechRecognitionUsageDescription: 「智搜」在开启「视频语音转文字」后,用本机语音识别把视频里的话转成文字以支持搜索。音频不会上传,识别全部在本机完成。

schemes:
  MediaSeek:
    build:
      targets:
        MediaSeek: all
    run:
      config: Debug
    archive:
      config: Release
