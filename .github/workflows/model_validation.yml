name: Model Validation
# SigLIP2 产线管道体检(transformers 5 单环境):
# ①官方 processor+pipeline 对拍(模型健康度) ②真值匹配对/交叉对尺度 ③产线导出链
#   (文本塔定长64双输入+手工4D掩码直通 encoder)CoreML 一致性与端到端区分度
# ④掩码语义阻断回归(第四十九批:SigLIP2 训练不掩码 pad,全1掩码=训练语义,
#   真实掩码=内容失明事故形态,不一致即退出非零)
# ⑤性别对比边距阻断回归(第五十批:性别词对比过滤的依据,女照边距≥+0.012/
#   男照≤0,边距复崩即退出非零)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/validate_siglip_coreml.py"
      - "scripts/export_models.py"
      - "scripts/patch_transformers_for_coreml.py"
      - ".github/workflows/model_validation.yml"

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖(与产线同版本)
        run: |
          pip install --upgrade pip
          pip install torch==2.7.0 "transformers>=5.0" "coremltools==9.0" sentencepiece pillow

      - name: 打 coremltools 兼容补丁
        run: python scripts/patch_transformers_for_coreml.py

      - name: 运行体检
        run: python scripts/validate_siglip_coreml.py extract v5.npz

      - name: 上传 npz(留档)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-npz
          path: "*.npz"
          retention-days: 90
          if-no-files-found: ignore

  dist:
    # so400m 门槛校准(2026-10-22):跑真实词集分数分布
    # (词典英译+模板 与 多语言整词 两套变体 × 全部探针图),纯测量不阻断。
    # 依据:门槛不可跨模型迁移(zudolab 实测门槛悬空=静默0结果;OpenAI 社区
    # 实测换模型分布整体移动)——重标必须拿模型自己的真尺度。仅手动触发。
    # 批141(2026-11-25):矩阵只留产线型号。base 一支随 Base 停用删除
    # (2.0 起唯一图像模型是 so400m);so400m 的型号原先写 patch16-384,与产线
    # 实际导出的 patch14-384(见 export_models.yml)不是同一个模型,改为一致。
    # 留档:2026-10-23 的 patch16 校准里,体检线用的三张图(不带冠词的模板串)
    # 为 猫 0.1069 / 狗 0.0927 / 电脑屏幕 0.1017,当时 validate 脚本的阻断线是
    # 0.09——狗那张余量只有 0.003。产线 patch14 的实测(批141,run 45644710670 与
    # 45649645789 两次逐位相同):猫 0.1168 / 狗 0.1170 / 电脑屏幕 0.0925;体检合格线
    # 自批141 起按模型取值(Base 0.09 / so400m 0.08,见 validate 脚本掩码回归段)。
    # 批148:门槛系数 0.87 也用这批分布对 Base 复核过,对 patch14 成立(见
    # ModelManager.siglipGateScale 注释)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - id: so400m
            model: google/siglip2-so400m-patch14-384
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖(dist 只需推理栈,不装 coremltools)
        run: |
          pip install --upgrade pip
          pip install torch==2.7.0 "transformers>=5.0" sentencepiece pillow

      - name: 跑分布测量
        run: python scripts/validate_siglip_coreml.py dist
        env:
          SIGLIP_MODEL: ${{ matrix.model }}

      - name: 上传分布 JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: dist_*.json
          retention-days: 90
          if-no-files-found: ignore
