name: MediaSeek
options:
  bundleIdPrefix: com.medseek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 0.1.6
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

targets:
  MediaSeek:
    type: application
    platform: iOS
    sources:
      - path: MediaSeek
        excludes:
          - "Resources/Models"
      - path: MediaSeek/Resources/Models
        type: folder
        optional: true
    dependencies:
      - package: SwiftTransformers
      - package: ZIPFoundation
    info:
      path: MediaSeek/Info.plist
      properties:
        CFBundleDisplayName: 智搜
        CFBundleShortVersionString: 1.0
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: 「智搜」需要读取你的照片与视频,在本机建立索引以支持语义搜索。所有处理均在设备本地完成,数据不会上传。

schemes:
  MediaSeek:
    build:
      targets:
        MediaSeek: all
    run:
      config: Debug
    archive:
      config: Release
