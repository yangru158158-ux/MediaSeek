name: Export Models
# 在 GitHub 免费提供的 macOS 机器上运行模型转换
# (coremltools 完整运行库仅 macOS 可用;Windows 上转换会缺库)
# 产出:models.zip 工件(含 TextEmbedder + ImageEmbedder),下载后导入 App 即可
#
# 单环境 transformers 5(2026-10-12 定案):
#   Gemma wrapper 自管掩码,不经 masking_utils;
#   SigLIP 文本塔在 export_models.py 内手工构建 4D 加性掩码直通 encoder,
#   绕开 v5 动态掩码闭包(coremltools 不可转)与 v4 的 argmax 池化错位(SigLIP2 池化锚点=末位)
#
# 2026-10-13 增加:so400m 增强图像模型包 + GitHub Release(models tag)托管,
# App 内 设置→模型在线更新 直接下载导入(manifest.json 描述各包版本/大小)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/export_models.py"
      - "scripts/export_face.py"
      - "scripts/patch_transformers_for_coreml.py"
      - ".github/workflows/export_models.yml"

permissions:
  contents: write   # 发布 Release(在线更新源)需要

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖(官方测试组合)
        run: |
          pip install --upgrade pip
          pip install torch==2.7.0 "transformers>=5.0" "coremltools==9.0" sentencepiece onnx onnx2torch onnxruntime

      - name: 打 coremltools 兼容补丁
        run: python scripts/patch_transformers_for_coreml.py

      - name: 下载人脸模型(insightface buffalo_l 的 r50,非商用许可,仅内部测试用)
        # 2026-10-13 由 buffalo_s 的 MobileFaceNet 升级 r50:mbf 轻量模型区分度
        # 天花板低,60% 分档同时装着同人的难照片与跨人/截图,分组混人(r50 端侧
        # 推理仍为毫秒级;检测/对齐不变,仅换身份嵌入模型)
        run: |
          curl -sL -o "$RUNNER_TEMP/buffalo_l.zip" https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
          unzip -o -j "$RUNNER_TEMP/buffalo_l.zip" w600k_r50.onnx -d "$RUNNER_TEMP/face"

      - name: 导出文本/图文模型(coremltools 9)
        run: |
          python scripts/export_models.py \
            --outdir MediaSeek/Resources/Models

      - name: 导出人脸模型并打包(onnx2torch→trace→ct,同环境)
        run: |
          python scripts/export_face.py \
            --onnx "$RUNNER_TEMP/face/w600k_r50.onnx" \
            --outdir MediaSeek/Resources/Models

      - name: 导出增强图像模型(so400m,可在线更新切换)
        # 877M 参数在 7GB 内存 runner 上偏紧,失败不阻塞主包发布(continue-on-error)
        continue-on-error: true
        env:
          SIGLIP_MODEL: google/siglip2-so400m-patch14-384
        run: |
          python scripts/export_models.py \
            --outdir "$RUNNER_TEMP/so400m" \
            --skip-gemma \
            --zip models-so400m.zip

      - name: 上传模型包
        uses: actions/upload-artifact@v4
        with:
          name: models-zip
          path: models.zip
          retention-days: 90

      - name: 上传仅人脸增量包
        uses: actions/upload-artifact@v4
        with:
          name: face-only-zip
          path: face-only.zip
          retention-days: 90

      - name: 生成更新清单 manifest.json
        run: |
          python - <<'EOF'
          import json, os, datetime, zipfile
          files = []
          def add(key, name, path, note, fingerprint=""):
              if os.path.exists(path):
                  files.append({
                      "key": key, "name": name,
                      "url": "https://github.com/yangru158158-ux/MediaSeek/releases/download/models/" + path,
                      "size": os.path.getsize(path), "note": note,
                      "fingerprint": fingerprint})
          # 批89:内容指纹——读 zip 内各槽位 meta.json 的内容派生字段
          # (文本/图像=dim,人脸=dim+ONNX 字节数)。值随模型内容变、不随重发变:
          # CI 重发同一批模型(版本字符串必变)指纹不变,App 端比对后明示
          # 「与服务端一致,无需重装」,不再诱导用户重下未变化的 1.2GB/2.1GB。
          # 拼法与 ModelManager.installedFingerprint 同规,改一处须同步另一处
          def slot_meta(zpath, dirname):
              try:
                  with zipfile.ZipFile(zpath) as z:
                      n = dirname + "/meta.json"
                      if n in z.namelist():
                          return json.loads(z.read(n))
              except Exception:
                  pass
              return {}
          def fp_full():
              t = slot_meta("models.zip", "TextEmbedder")
              i = slot_meta("models.zip", "ImageEmbedder")
              f = slot_meta("models.zip", "FaceEmbedder")
              return "T:%d|I:%d|F:%d:%d" % (
                  t.get("dim", 0), i.get("dim", 0),
                  f.get("dim", 0), f.get("model_size", 0))
          def fp_pro():
              i = slot_meta("models-so400m.zip", "ImageEmbedder")
              return "P:%d" % i.get("dim", 0)
          add("full", "标准完整包(文本+图文+人脸)", "models.zip",
              "三个模型全量;首次安装或一次到位用这个", fingerprint=fp_full())
          # 第八十四批:人脸增量包②下架——完整包①自 10-13 起已内置 r50 人脸,
          # ②只对更旧的①有用,新装走不到(客户端 ModelUpdateView 已同步过滤
          # key=face;face-only.zip 仍随 Release 上传,仅不再进 manifest)
          add("so400m", "增强图像模型(so400m)", "models-so400m.zip",
              "识别更强、导入后需全量重建图像向量(约1-2小时,可中断续跑)", fingerprint=fp_pro())
          m = {
              "version": (os.environ.get("GITHUB_SHA", "")[:7] or "dev")
                         + "-" + datetime.datetime.utcnow().strftime("%Y%m%d%H%M"),
              "date": datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC"),
              "files": files,
          }
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(m, f, ensure_ascii=False, indent=1)
          print(json.dumps(m, ensure_ascii=False)[:600])
          EOF

      - name: 发布模型包到 GitHub Release(在线更新源)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(manifest.json)
          for f in models.zip face-only.zip models-so400m.zip; do
            [ -f "$f" ] && assets+=("$f")
          done
          gh release delete models -y --cleanup-tag || true
          gh release create models "${assets[@]}" \
            --title "模型包(在线更新源)" \
            --notes "CI 自动发布;App 内 设置→模型在线更新 读取 manifest.json。仅限本人设备使用。"
